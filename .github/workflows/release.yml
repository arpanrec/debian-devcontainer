name: Release
"on":
    push:
        branches:
            - main

jobs:
    release:
        timeout-minutes: 30
        name: release
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Import GPG key
              id: import-gpg
              uses: crazy-max/ghaction-import-gpg@v6.3.0
              with:
                  gpg_private_key: "${{ secrets.GH_BOT_GPG_PRIVATE_KEY }}"
                  passphrase: "${{ secrets.GH_BOT_GPG_PASSPHRASE }}"
                  git_user_signingkey: true
                  git_commit_gpgsign: true
                  trust_level: 5

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Release
              run: |
                  git config --global user.email "${{ steps.import-gpg.outputs.email }}"
                  git config --global user.name "${{ steps.import-gpg.outputs.name }}"
                  npx --yes \
                      -p semantic-release@25.0.9 \
                      -p @semantic-release/commit-analyzer@13.0.1 \
                      -p @semantic-release/release-notes-generator@14.1.1 \
                      -p @semantic-release/github@12.0.10 \
                      semantic-release --extends ./.github/files/release.config.cjs
              env:
                  GITHUB_TOKEN: "${{ secrets.GH_BOT_API_TOKEN }}"
                  GIT_AUTHOR_NAME: "${{ steps.import-gpg.outputs.name }}"
                  GIT_AUTHOR_EMAIL: "${{ steps.import-gpg.outputs.email }}"
                  GIT_COMMITTER_NAME: "${{ steps.import-gpg.outputs.name }}"
                  GIT_COMMITTER_EMAIL: "${{ steps.import-gpg.outputs.email }}"
