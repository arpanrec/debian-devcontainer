name: Docker Publish
"on":
    release:
        types:
            - published

jobs:
    build:
        timeout-minutes: 120
        name: build and push
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: "${{ github.event.release.tag_name }}"
                  persist-credentials: false

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
              with:
                  platforms: arm64,amd64

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: docker.io
                  username: "${{ secrets.DOCKER_PROD_USER }}"
                  password: "${{ secrets.DOCKER_PROD_API_KEY }}"

            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      docker.io/${{ secrets.DOCKER_PROD_USER }}/${{ github.event.repository.name }}:${{ github.event.release.tag_name }}
                      docker.io/${{ secrets.DOCKER_PROD_USER }}/${{ github.event.repository.name }}:latest
                  cache-from: "type=registry,ref=docker.io/${{ secrets.DOCKER_PROD_USER }}/${{ github.event.repository.name }}:buildcache"
                  cache-to: "type=registry,ref=docker.io/${{ secrets.DOCKER_PROD_USER }}/${{ github.event.repository.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true"
